<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Secret — Austin</title>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            color: #26372d;
            background: linear-gradient(135deg, #f4f2e8, #e3e9dd, #f8f5e9);
        }
        
        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        
        .card {
            width: 100%;
            max-width: 440px;
            padding: 48px 32px;
            text-align: center;
            background: #fffdf7;
            border: 1px solid #d5ddcf;
            box-shadow: 0 20px 60px rgba(35, 71, 53, .12);
            animation: fadeIn .8s ease both;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .heart {
            font-size: 38px;
            color: #234735;
            margin-bottom: 24px;
        }
        
        .eyebrow {
            color: #38566a;
            font: 600 10px Arial, sans-serif;
            letter-spacing: .2em;
            line-height: 2;
        }
        
        h1 {
            margin: 25px 0 18px;
            font-size: clamp(36px, 8vw, 48px);
            font-weight: normal;
        }
        
        .italic {
            color: #55745c;
            font-style: italic;
        }
        
        .message {
            margin: 0 0 28px;
            color: #506052;
            line-height: 1.8;
            font-size: 15px;
        }
        
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #cbd6c6;
            background: #fffefa;
            font: 16px Georgia, serif;
            text-align: center;
        }
        
        input:focus {
            outline: 2px solid #55745c;
            outline-offset: 2px;
        }
        
        .main-button {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid #234735;
            background: #234735;
            color: #fffdf7;
            font: 16px Georgia, serif;
            cursor: pointer;
            transition: .3s ease;
        }
        
        .main-button:hover {
            background: #55745c;
            border-color: #55745c;
        }
        
        .feedback {
            min-height: 24px;
            margin: 16px 0 0;
            color: #a33d3d;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #55745c;
            font-size: 13px;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="card">

            <div class="heart">♡</div>

            <div class="eyebrow">
                EVEN THE SMALLEST KEY CAN UNLOCK<br> THE GREATEST TREASURE
            </div>

            <h1>
                Just for <span class="italic">you.</span>
            </h1>

            <p class="message">
                Every little secret has a key. Do you know ours?
            </p>

            <form id="passwordForm">
                <input id="secretPassword" type="password" placeholder="Enter our secret" aria-label="Enter our secret" autocomplete="off" required>

                <button class="main-button" type="submit">
                    Unlock my heart ♡
                </button>
            </form>

            <p class="feedback" id="feedback" role="status"></p>

            <a class="back-link" href="index.html">
                ← Back to your invitation
            </a>

        </section>
    </main>

    <script>
        const passwordForm = document.getElementById("passwordForm");
        const secretPassword = document.getElementById("secretPassword");
        const feedback = document.getElementById("feedback");

        passwordForm.addEventListener("submit", function(event) {
            event.preventDefault();

            if (secretPassword.value === "evenstar") {
                feedback.style.color = "#234735";
                feedback.textContent = "You found the key, my love. ♡";

                setTimeout(function() {
                    window.location.href = "surprise.html";
                }, 900);

            } else {
                feedback.style.color = "#a33d3d";
                feedback.textContent = "Not quite, love. Try again. ♡";
                secretPassword.value = "";
                secretPassword.focus();
            }
        });
    </script>
</body>

</html>
